# Laptop interno
monitor=eDP-1,1920x1080@60,0x0,1.0

# Monitor central (HDMI)
monitor=HDMI-A-1,1920x1080@60,1600x0,1.0

# Samsung vertical derecha — DP-1 en Lenovo, DP-2 en desktop
monitor=DP-1,1920x1080@60,3520x0,1.2,transform,3
monitor=DP-2,1920x1080@60,3520x0,1.2,transform,3

# Fallback para monitores no declarados
monitor=,preferred,auto,1.0
