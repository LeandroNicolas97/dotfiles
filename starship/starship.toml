# ~/.config/starship.toml

# Formato en UNA SOLA LÍNEA
format = """
$username\
$directory\
$git_branch\
$git_status\
$python\
$nodejs\
$rust\
$c\
$character"""

# Usuario (tu nombre)
[username]
style_user = "bold blue"
style_root = "bold cyan"
format = "[$user](bold blue)/"
disabled = true
show_always = true

# Hostname (DESACTIVADO)
[hostname]
disabled = true

# Directorio actual (mostrar ruta con varios niveles)
[directory]
truncation_length = 0
truncate_to_repo = false
style = "bold cyan"
format = "[$path]($style)"

# Rama de Git
[git_branch]
symbol = "  "
style = "bold green"
format = "[$symbol$branch]($style) "

# Estado de Git
[git_status]
style = "bold red"
format = '([\[$all_status$ahead_behind\]]($style) )'
ahead = "⇡${count} "
behind = "⇣${count} "
diverged = "⇕⇡${ahead_count}⇣${behind_count} "
conflicted = "🏳 "
untracked = "?${count} "
stashed = "📦 "
modified = "!${count} "
staged = "+${count} "
renamed = "»${count} "
deleted = "✘${count} "

# Caracter del prompt
[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"

# Lenguajes (opcional)
[python]
symbol = " "
style = "bold yellow"
format = '[$symbol($virtualenv)]($style) '
detect_extensions = []
detect_files = []
detect_folders = []

[nodejs]
symbol = " "
format = 'via [$symbol($version )]($style)'

[rust]
symbol = " "
format = 'via [$symbol($version )]($style)'

[c]
symbol = " "
format = 'via [$symbol($version )]($style)'

[golang]
symbol = " "
format = 'via [$symbol($version )]($style)'
